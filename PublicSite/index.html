<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Essentials -->
  <meta name="theme-color" content="#C4A060" />
  <meta name="color-scheme" content="light" />

  <!-- Defaults SEO -->
  <meta name="description"
    content="Resto - Restaurant français traditionnel à Paris, à deux pas de Notre-Dame. Réservez votre table pour une expérience culinaire authentique." />
  <meta name="keywords"
    content="restaurant français, Paris, Notre-Dame, cuisine traditionnelle, réservation, restaurant gastronomique" />
  <meta name="author" content="Resto" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="revisit-after" content="7 days" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:site_name" content="Resto" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:creator" content="@lesdeuxcolombes" />

  <!-- Canonical & Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Preconnect DNS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

  <title>Resto - Restaurant français Paris</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
