name: Deploy frontends to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - PublicSite/**
      - Administration/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PublicSite/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: PublicSite
        run: npm ci
      - name: Build public site
        working-directory: PublicSite
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://restaurant-sxxt.onrender.com' }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://vessah14.github.io' }}
          VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL || 'https://vessah14.github.io/Restaurant/admin/' }}
          VITE_BASE_PATH: /Restaurant/
        run: npm run build
      - name: Install administration dependencies
        working-directory: Administration
        run: npm ci
      - name: Build administration
        working-directory: Administration
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://restaurant-sxxt.onrender.com' }}
          VITE_BASE_PATH: /Restaurant/admin/
        run: npm run build
      - name: Assemble Pages artifact
        shell: bash
        run: |
          mkdir -p PublicSite/dist/admin
          cp -R Administration/dist/. PublicSite/dist/admin/
          cp PublicSite/dist/index.html PublicSite/dist/404.html
          cp Administration/dist/index.html PublicSite/dist/admin/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: PublicSite/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
