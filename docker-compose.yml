services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      DeepL__ApiKey: ${DEEPL_API_KEY}
      FrontendUrl: ${FRONTEND_URL}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN}
      Cors__AllowedOrigins__1: ${ADMIN_ORIGIN}
      AllowedHosts: ${API_HOST}
      Database__ApplyMigrations: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  public-site:
    build:
      context: ./PublicSite
      args:
        VITE_API_URL: ${VITE_API_URL:-https://restaurant-sxxt.onrender.com}
        VITE_SITE_URL: ${PUBLIC_ORIGIN}
        VITE_ADMIN_URL: ${ADMIN_ORIGIN:-http://localhost:8082}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8081}:80"

  administration:
    build:
      context: ./Administration
      args:
        VITE_API_URL: ${VITE_ADMIN_API_URL:-https://restaurant-sxxt.onrender.com}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8082}:80"

volumes:
  postgres-data:
